name: Smart Tempo source build without private BPM data

on:
  push:
    branches:
      - main
      - 'migration/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-tempo-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Checkout only public source
        uses: actions/checkout@v4
        with:
          # Pull-request default checkout is a synthetic merge commit, NOT the
          # reviewed product source SHA. Pin the exact PR head for all native
          # trace, oracle and no-write qualifications.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact checked-out product source SHA
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = ((& git rev-parse HEAD) | Out-String).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected.ToLowerInvariant()) {
            throw "Source checkout mismatch: expected $expected, got $actual"
          }
          Write-Host "SMART_TEMPO_EXACT_CHECKOUT_SHA=$actual"

      - name: Require absence of personal research
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object {
            $_ -match '(^|/)(docs/reports|private-research|owner-data|local-research|holdout|audio-corpus|ground-truth)' -or
            $_ -match '\.(mp3|flac|wav|wvp|m4a|tsv\.gz|sqlite|sqlite\.gz|b64)$'
          })
          if ($forbidden.Count -gt 0) { throw ('Disallowed personal/research payload: ' + ($forbidden -join ', ')) }

      # Fast source-only architecture proof, before dependency downloads.
      - name: HARD GATE - full Smart Tempo architecture source contract
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_smart_tempo_architecture_audit.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Smart Tempo architecture source-contract regressions failed' }
          python ./tools/audit_smart_tempo_pipeline.py
          if ($LASTEXITCODE -ne 0) { throw 'Smart Tempo architecture source audit failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_ci_pipeline_trace.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CI-only candidate lineage integrity regressions failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_policy_rail_fates.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native Policy FullBoard rail source-veto tests failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_writer_resolution.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Applied native writer branch provenance tests failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_general_alt_promotion.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'General-144 native promotion source-ID and ratio regression failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_cluster_rail_fates.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent native cluster rail fate chronology failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_low_upper_fates.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent native low upper-branch fate chronology failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_low_continuous_fates.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent native low continuous-center fate chronology failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_raw_fates.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent native raw-selector fate automaton failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_manual_export.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Manual review export native provenance regressions failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_candidate_fates.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent candidate-fate chronology regressions failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_native_mutations.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native-host trace mutation-gate regressions failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_ci_pilot_contract.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Cross-architecture Phase-B pilot contract failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_pilot_cohort.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Phase-B pilot cohort adversarial tests failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_candidate_recall.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent source-vs-reference recall contract failed' }
          python -m unittest discover -s tests -p 'test_smart_tempo_b_shadow_rank.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-ID-blind shadow ranking adversarial contracts failed' }
          # Parse the entire original-host harness before downloading SDK/WTL
          # or spending minutes on compilation. This is syntax-only; it does
          # not run foobar, install software, or touch any user files.
          $tokens=$null; $parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath 'tests/diagnostic_live_host_smoke.ps1').Path,
            [ref]$tokens,[ref]$parseErrors)
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            throw ('PowerShell host harness AST parser failed: ' + (($parseErrors | ForEach-Object { $_.ToString() }) -join '; '))
          }
          Write-Host 'SMART_TEMPO_HOST_HARNESS_POWERSHELL_AST=PASS'
          Write-Host 'SMART_TEMPO_ARCHITECTURE_PHASE_A_SOURCE_CONTRACT=PASS'
          Write-Host 'SMART_TEMPO_MUSICAL_BPM_QUALITY=NOT_INFERRED'

      - name: Checkout public foobar2000 SDK (2026-10-01)
        uses: actions/checkout@v4
        with:
          repository: reupen/foobar2000-sdk-unmodified
          ref: 9e4823ee802dfb704de1ce42401b48b407a54180
          path: sdk
          persist-credentials: false

      - name: Download official WTL 10.1.0 headers (2026 release)
        shell: pwsh
        run: |
          # Published on NuGet by the WTL maintainers, based on the official
          # WTL 10.01 release for Visual Studio 2022/2026. Never use
          # credentials or fetch source from any private repository.
          $url = 'https://api.nuget.org/v3-flatcontainer/wtl/10.1.0/wtl.10.1.0.nupkg'
          $archive = Join-Path $env:RUNNER_TEMP 'wtl-10.1.0.nupkg'
          $unpacked = Join-Path $env:RUNNER_TEMP 'wtl-10.1.0-extracted'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($archive, $unpacked)
          $headers = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter atlapp.h)
          if ($headers.Count -ne 1) { throw "Expected one WTL atlapp.h, got $($headers.Count)" }
          $include = $headers[0].Directory.FullName
          New-Item -ItemType Directory -Force -Path wtl/Include | Out-Null
          Copy-Item -Path (Join-Path $include '*') -Destination wtl/Include/ -Recurse -Force
          $required = @('atlapp.h', 'atlgdi.h', 'atlctrls.h', 'atlwinx.h')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'wtl/Include' $name))) { throw "WTL 10.1.0 missing: $name" }
          }
          Write-Host "WTL 10.1.0 installed; $((Get-ChildItem wtl/Include -File).Count) public WTL header files"

      - name: Verify required dependency and license notices
        shell: pwsh
        run: |
          foreach ($file in @('sdk/sdk-license.txt', 'sdk/foobar2000/shared/shared-Win32.lib', 'sdk/foobar2000/shared/shared-x64.lib', 'wtl/Include/atlapp.h', 'licenses/wtl-MS-PL.txt', 'licenses/kissfft_license.txt', 'src/kiss_fft/COPYING')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing required public SDK/vendor input: $file" }
          }
          Copy-Item licenses/wtl-MS-PL.txt wtl/MS-PL.txt -Force

      - name: Enforce source hardening contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/source_hardening_contract.ps1

      - name: Run isolated synthetic sampling scheduler tests
        shell: pwsh
        run: |
          cmake -S tests -B synthetic-test-build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic test CMake setup failed' }
          cmake --build synthetic-test-build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic test build failed' }
          ctest --test-dir synthetic-test-build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic MIR window tests failed' }

      - name: Verify exact-tempo synthetic WAV reference corpus
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_synthetic_bpm_reference.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic WAV oracle regressions failed' }
          # Generated WAV files exist only inside unittest temporary folders.
          # BPM accuracy is NOT asserted here; future CI will analyze these
          # fixtures with the real component and compare its reported BPMs.

      - name: Verify BPM oracle scoring and ambiguous/held cases
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_synthetic_bpm_scorer.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic BPM scorer unit tests failed' }

      - name: Run privacy-safe MW1 evidence comparator tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_mw1_comparator.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'MW1 synthetic evaluator tests failed' }

      - name: Build Win32 and x64 with public SDK
        shell: pwsh
        run: |
          # The SDK's independent helpers project includes atlapp.h but does
          # not inherit Smart Tempo's private WTL include-directory settings.
          # Export it for ALL MSBuild C++ projects in this build.
          $wtlInclude = Join-Path $env:GITHUB_WORKSPACE 'wtl/Include'
          $env:INCLUDE = $wtlInclude + ';' + $env:INCLUDE
          # MSVC's CL environment variable adds arguments to EVERY cl.exe
          # invocation, including subprojects with hard-coded include paths.
          # The current MSVC v145/C++23 parser rejects several legacy WTL
          # non-dependent names inside class templates (CDCHandle, ModifyStyle,
          # GetWndClassName). Microsoft's /Zc:twoPhase- preserves historical
          # delayed lookup while retaining the other /permissive- diagnostics.
          $env:CL = '/Zc:twoPhase- /I"' + $wtlInclude + '" ' + $env:CL
          Write-Host "WTL headers supplied to all MSVC projects: $wtlInclude"
          & cmd.exe /c 'call build.bat'
          if ($LASTEXITCODE -ne 0) { throw 'Smart Tempo public SDK build failed' }

      # Actual host loading is required in BOTH architectures, not just
      # a successful MSVC link. Keep each test in this same ephemeral build job.
      - name: HARD GATE - real foobar2000 Win32 component load
        uses: lxsdd/dev-infrastructure-public/.github/actions/foobar-host-smoke@7acb670f96fff4f63e8f84d8ccb3a4c3f84b8c64
        with:
          architecture: Win32
          component-dll: build/foo_smart_tempo.dll
      - name: HARD GATE - real foobar2000 x64 component load
        uses: lxsdd/dev-infrastructure-public/.github/actions/foobar-host-smoke@7acb670f96fff4f63e8f84d8ccb3a4c3f84b8c64
        with:
          architecture: x64
          component-dll: build/x64/foo_smart_tempo.dll
      - name: Build CI-only SDK diagnostic dispatcher (Win32 and x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Dedicated output directories preserve ordinary validated binaries.
          $root = (Get-Location).Path
          $wtl = Join-Path $root 'wtl/Include'
          $env:INCLUDE = $wtl + ';' + $env:INCLUDE
          $env:CL = '/Zc:twoPhase- /I"' + $wtl + '" ' + $env:CL
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe')[0]
          if (-not $msbuild -or -not (Test-Path $msbuild)) { throw 'No MSBuild for CI probe' }
          foreach ($arch in @('Win32', 'x64')) {
            $out = Join-Path $root ('build/ci-probe/' + $arch)
            $obj = Join-Path $root ('build/obj/ci-probe/' + $arch)
            New-Item -ItemType Directory -Force -Path $out,$obj | Out-Null
            & $msbuild 'src/foo_smart_tempo/foo_smart_tempo.vcxproj' `
              '/t:Rebuild' '/p:Configuration=Release' "/p:Platform=$arch" `
              '/p:PlatformToolset=v145' '/p:CppLanguageStandard=cpp23' `
              '/p:SmartTempoCIRuntimeProbe=true' `
              "/p:SolutionDir=$root\" "/p:OutDir=$out\" "/p:IntDir=$obj\"
            if ($LASTEXITCODE -ne 0) { throw "CI host diagnostic build failed for $arch" }
            if (-not (Test-Path (Join-Path $out 'foo_smart_tempo.dll'))) {
              throw "CI host diagnostic DLL missing for $arch"
            }
            Write-Host "CI_PROBE_BUILD_$arch=PASS"
          }

      # Product-specific runtime qualification: unlike shared host-load smoke,
      # exercise the real diagnostic context action on disposable WAV/CUE.
      # The two checks must pass independently. No artifacts are uploaded.
      - name: HARD GATE - Win32 diagnostic menu and media no-write
        shell: pwsh
        run: |
          & ./tests/diagnostic_live_host_smoke.ps1 -Architecture Win32 -ComponentDll 'build/ci-probe/Win32/foo_smart_tempo.dll'

      - name: HARD GATE - x64 diagnostic menu and media no-write
        shell: pwsh
        run: |
          & ./tests/diagnostic_live_host_smoke.ps1 -Architecture x64 -ComponentDll 'build/ci-probe/x64/foo_smart_tempo.dll'

      # CI-only, no artifact uploads: join both host observations at exact source.
      - name: HARD GATE - joined Win32/x64 native B-pilot cohort evidence
        shell: pwsh
        run: |
          $sourceSha=((& git rev-parse HEAD) | Out-String).Trim().ToLowerInvariant()
          python ./tools/audit_smart_tempo_b_pilot_cohort.py `
            --expected-source-sha $sourceSha `
            --report "$env:RUNNER_TEMP/smart-tempo-b-pilot-Win32.json" `
            --report "$env:RUNNER_TEMP/smart-tempo-b-pilot-x64.json"
          if ($LASTEXITCODE -ne 0) { throw 'Dual-architecture B-pilot evidence incomplete' }

      - name: Package foobar2000 component
        shell: cmd
        run: call pack_component.bat

      - name: Assert binary-only package privacy boundary
        shell: pwsh
        run: |
          # The PowerShell validators use terminating exceptions, NOT process
          # exit codes. $LASTEXITCODE is stale after invoking a .ps1 script.
          $ErrorActionPreference = 'Stop'
          & ./tools/verify-private-data-package-boundary.ps1 -ComponentPath 'build/foo_smart_tempo_2.2.0.fb2k-component'
          & ./tools/verify-fb2k-component.ps1 -ComponentPath 'build/foo_smart_tempo_2.2.0.fb2k-component'

      # No upload-artifact here. The generated DLL/component remains inside
      # the temporary Actions runner for validation, then is discarded.
      # A public Actions artifact would redistribute binaries even without
      # a GitHub Release. Restore publishing only after the GPL/MIR and
      # MS-PL/WTL compatibility gate in issue #2 is resolved.
