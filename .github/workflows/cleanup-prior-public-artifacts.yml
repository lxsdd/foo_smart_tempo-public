name: One-time cleanup of pre-gate Smart Tempo binary artifacts

# Fires on the merge that first adds the GPL notice. No recurring schedule.
on:
  push:
    branches: [main]
    paths:
      - 'licenses/GPL-2.0-or-later.txt'

permissions: {}

jobs:
  delete-legacy-binaries:
    if: github.repository == 'lxsdd/foo_smart_tempo-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only the five verified pre-gate component artifacts
        shell: bash
        run: |
          set -euo pipefail
          repo="lxsdd/foo_smart_tempo-public"
          ids=(11564357894 11565270317 11563975728 11562234488 11562673644)
          for id in "${ids[@]}"; do
            meta="$(gh api "repos/$repo/actions/artifacts/$id")"
            name="$(jq -r '.name' <<< "$meta")"
            if [[ "$name" != "foo_smart_tempo-source-candidate" ]]; then
              echo "::error::Unexpected artifact name $name for id $id"
              exit 1
            fi
            gh api -X DELETE "repos/$repo/actions/artifacts/$id" >/dev/null
            echo "Removed legacy binary artifact id $id"
          done
